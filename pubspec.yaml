name: upazila_app
description: Upazila Digital Ecosystem mobile app (Phase 3).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: 14.2.7
  dio: ^5.11.0
  flutter_secure_storage: ^10.0.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.1
  geolocator: ^14.0.3
  package_info_plus: ^10.2.1
  intl: ^0.20.3
  sentry_flutter: ^9.28.0
  url_launcher: ^6.3.2
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
